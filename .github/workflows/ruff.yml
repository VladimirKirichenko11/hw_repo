name: Ruff Check

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check if Python files exist
      id: check_files
      run: |
        if find . -name "*.py" -not -path "./.*" | grep -q .; then
          echo "python_files_exist=true" >> $GITHUB_OUTPUT
        else
          echo "python_files_exist=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up Python
      if: steps.check_files.outputs.python_files_exist == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install ruff
      if: steps.check_files.outputs.python_files_exist == 'true'
      run: pip install ruff
    
    - name: Run ruff check
      if: steps.check_files.outputs.python_files_exist == 'true'
      run: ruff check .
    
    - name: Run ruff format check
      if: steps.check_files.outputs.python_files_exist == 'true'
      run: ruff format --check .
    
    - name: Skip if no Python files
      if: steps.check_files.outputs.python_files_exist == 'false'
      run: echo "No Python files found, skipping Ruff checks"
